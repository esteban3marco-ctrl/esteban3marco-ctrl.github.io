<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gasthaus zur Linde — Speisekarte</title>
<meta name="description" content="Digitale Speisekarte mit vollständiger Allergendeklaration nach LIV.">
<meta name="theme-color" content="#292929">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23292929'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23E6DCC9' font-family='Helvetica,Arial'%3E%E2%97%89%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Sibuya usa Bebas Neue Pro + Acumin Pro (Adobe Fonts, licencia de pago).
     Bebas Neue es prácticamente la misma cara; Barlow es el equivalente
     libre más cercano a Acumin Pro. Si se licencia Adobe, se cambia aquí. -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CARTA PÚBLICA — prototipo demo (Suiza)
   Un solo fichero, sin dependencias externas, carga instantánea.

   Dirección: estilo tipográfico internacional suizo.
   Grotesca + monoespaciada. Acento petróleo (Vierwaldstättersee).
   El rojo es SOLO semáforo de alérgeno, nunca decorativo.
   ============================================================ */

/* ---- Tokens ----
   Diseño comprometido en oscuro, como la referencia: sin variante
   clara. Todo se pinta explícitamente para que no herede nada. ---- */
:root{
  --paper:#292929;              /* carbón cálido, no negro */
  --surface:#313131;
  --surface-2:#3A3A3A;
  --ink:#E6DCC9;                /* crema: es el color de texto Y el acento */
  --ink-soft:rgba(230,220,201,.68);
  --ink-faint:rgba(230,220,201,.44);
  --rule:rgba(230,220,201,.17);
  --rule-soft:rgba(230,220,201,.09);
  --accent:#E6DCC9;
  --accent-ink:#292929;
  --accent-wash:rgba(230,220,201,.10);
  --gold:#CCBB9B;
  --alert:#D4735C;              /* terracota: avisa sin salirse de la paleta */
  --alert-wash:rgba(212,115,92,.16);
  --ok:#A8B79A;
  --ok-wash:rgba(168,183,154,.16);
  --scrim:rgba(20,20,20,.78);
  --lift:0 24px 64px rgba(0,0,0,.55);
  --glow:0 0 0 1px rgba(230,220,201,.4), 0 0 26px rgba(230,220,201,.13);

  --display:"Bebas Neue",Impact,"Haettenschweiler","Arial Narrow",sans-serif;
  --sans:Barlow,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --script:var(--display);
  --grotesk:var(--sans);
  --mono:var(--sans);
  /* Monoespaciada sólo donde es semánticamente correcta: la comanda de cocina */
  --ticket:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,monospace;

  --wrap:660px;
  --r:10px;
  --r-lg:10px;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* El atributo hidden debe ganar a cualquier display de componente */
[hidden]{display:none !important}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--grotesk);
  font-size:16px;
  line-height:1.45;
  letter-spacing:-.006em;
  -webkit-font-smoothing:antialiased;
  overflow-wrap:break-word;
}
body.is-locked{overflow:hidden}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  html{scroll-behavior:auto}
}

.wrap{max-width:var(--wrap);margin:0 auto;padding:0 22px}

/* Registro documental: mono, versalitas, tracking abierto */
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tag{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);
}

/* ---------- Cabecera ---------- */
.masthead{padding:30px 0 0}
.masthead .eyebrow{
  font-size:11.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);
}
.masthead h1{
  font-size:clamp(34px,9vw,50px);font-weight:800;line-height:1;letter-spacing:-.042em;
  margin:11px 0 0;text-wrap:balance;
}
.masthead .facts{
  display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:14px;
  font-size:13px;font-weight:500;color:var(--ink-soft);
}
.masthead .facts span{white-space:nowrap}
.masthead .hr{height:1px;background:var(--rule);margin-top:22px}

/* ---------- Idioma ---------- */
.langbar{display:flex;gap:6px;padding:14px 0}
.langbar button{
  flex:1;padding:10px 0;border-radius:999px;background:var(--surface-2);
  font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft);
  transition:background .15s,color .15s;
}
.langbar button:hover{color:var(--ink)}
.langbar button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- Barra pegajosa ---------- */
.sticky{
  position:sticky;top:0;z-index:30;
  background:var(--paper);
  border-bottom:1px solid var(--rule);
}
@supports (backdrop-filter:blur(1px)){
  .sticky{background:color-mix(in srgb, var(--paper) 90%, transparent);backdrop-filter:saturate(160%) blur(12px);-webkit-backdrop-filter:saturate(160%) blur(12px)}
}
.filterrow{display:flex;gap:8px;align-items:stretch;padding:11px 0}
.filterbtn{
  flex:1;display:flex;align-items:center;justify-content:flex-start;gap:9px;
  padding:11px 13px;border:1px solid var(--rule);border-radius:var(--r);
  font-size:13.5px;font-weight:500;background:var(--surface);
  transition:border-color .14s, color .14s;
}
.filterbtn:hover{border-color:var(--ink-soft)}
.filterbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-wash)}
.filterbtn .count{
  margin-left:auto;min-width:19px;height:19px;padding:0 5px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);
  font-family:var(--mono);font-size:10.5px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;
}
.iconbtn{
  width:43px;flex:0 0 43px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);
  transition:border-color .14s;
}
.iconbtn:hover{border-color:var(--ink-soft)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:square}

.navchips{display:flex;gap:0;overflow-x:auto;padding:0 22px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.navchips::-webkit-scrollbar{display:none}
.navchips a{
  flex:0 0 auto;padding:8px 14px;margin-right:7px;border-radius:999px;
  background:var(--surface-2);font-size:13px;font-weight:600;letter-spacing:-.01em;
  color:var(--ink-soft);text-decoration:none;white-space:nowrap;transition:all .15s;
}
.navchips a:hover{background:var(--ink);color:var(--paper)}

/* ---------- Aviso de filtro activo ---------- */
.activenote{
  display:none;margin:18px 0 0;padding:13px 15px;border-radius:var(--r);
  background:var(--accent-wash);border-left:2px solid var(--accent);
  font-size:13.5px;line-height:1.5;
}
.activenote.show{display:block}
.activenote strong{font-weight:600;letter-spacing:-.01em}
.activenote .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.activenote button{
  margin-top:9px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);border-bottom:1px solid currentColor;padding-bottom:1px;
}

/* ---------- Smart Waiter ---------- */
.waiter{margin:26px 0 0;border:1px solid var(--accent);border-radius:var(--r-lg);overflow:hidden}
.waiter .whead{
  display:flex;align-items:baseline;gap:10px;padding:12px 15px 11px;
  background:var(--accent-wash);border-bottom:1px solid var(--accent);
}
.waiter .whead .wlabel{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
}
.waiter .whead .whint{font-size:11.5px;color:var(--ink-soft);margin-left:auto}
.wform{display:flex;gap:0;border-bottom:1px solid var(--rule)}
.wform input{
  flex:1;min-width:0;border:0;background:var(--surface);color:var(--ink);
  padding:14px 15px;font-family:inherit;font-size:14.5px;letter-spacing:-.01em;
}
.wform input::placeholder{color:var(--ink-faint)}
.wform input:focus{outline:0;box-shadow:inset 0 0 0 2px var(--accent)}
.wform button{
  flex:0 0 auto;padding:0 17px;background:var(--accent);color:var(--accent-ink);
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
}
.wsuggest{display:flex;gap:6px;flex-wrap:wrap;padding:12px 15px;background:var(--surface)}
.wsuggest button{
  padding:6px 10px;border:1px solid var(--rule);border-radius:var(--r);
  font-size:12.5px;color:var(--ink-soft);transition:all .13s;
}
.wsuggest button:hover{border-color:var(--accent);color:var(--accent)}

.wout{display:none;background:var(--surface);border-top:1px solid var(--rule)}
.wout.show{display:block}
.wread{
  display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:13px 15px 0;
}
.wread .rl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-right:4px}
.wread .rc{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:4px 7px;border-radius:999px;
  background:var(--accent-wash);color:var(--accent);
}
.wlist{padding:13px 15px 0}
.wcard{
  display:block;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--rule-soft);
}
.wcard:last-of-type{border-bottom:0}
.wcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.wcard .rank{
  font-family:var(--mono);font-size:10.5px;color:var(--accent);margin-right:8px;font-variant-numeric:tabular-nums;
}
.wcard .name{font-size:16px;font-weight:500;letter-spacing:-.022em}
.wcard .price{font-family:var(--mono);font-size:13.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.wcard .why{
  margin:7px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink);max-width:52ch;
  padding-left:11px;border-left:2px solid var(--accent);
}
.wcard .codes{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px}
.wcard .shot{
  width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:var(--r);margin-top:10px;display:block;
}
.wpair{
  margin:0;padding:13px 15px 15px;border-top:1px solid var(--rule-soft);
  font-size:13px;color:var(--ink-soft);line-height:1.5;
}
.wpair b{font-weight:500;color:var(--ink)}
.wpair .p{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wnone{padding:16px 15px 18px;font-size:13.5px;color:var(--ink-soft);line-height:1.5}
.wdisclaimer{
  padding:0 15px 14px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;
  color:var(--ink-faint);line-height:1.6;
}

/* ---------- Menú del día: único bloque invertido ---------- */
.tages{
  margin:24px 0 4px;padding:20px 20px 18px;border-radius:var(--r-lg);
  background:var(--accent);color:var(--accent-ink);
}
.tages .label{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  opacity:.72;
}
.tages .date{font-family:var(--mono);font-size:11.5px;opacity:.72;margin-top:3px}
.tages h2{font-size:21px;font-weight:600;letter-spacing:-.025em;margin:14px 0 6px;line-height:1.15}
.tages p{margin:0;font-size:14px;line-height:1.5;opacity:.86}
.tages .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-top:18px}
.tages .codes{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tages .acode{border-color:currentColor;color:inherit;opacity:.78}
.tages .price{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- Secciones ---------- */
.section{padding-top:32px;scroll-margin-top:112px}
.section > h2{
  font-size:22px;font-weight:800;letter-spacing:-.035em;color:var(--ink);margin:0 0 13px;
}
.section .rule{display:none}

/* ---------- Plato ---------- */
.dish{
  width:100%;text-align:left;display:block;
  padding:16px;margin-bottom:10px;background:var(--surface);
  border:1px solid var(--rule);border-radius:var(--r);
  transition:opacity .18s, border-color .15s, transform .15s;
}
.dish:hover{border-color:var(--ink);transform:translateY(-1px)}
.dish.dimmed{opacity:.34}
.dish.hidden{display:none}
.dish .top{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.dish .name{font-size:17px;font-weight:700;line-height:1.25;letter-spacing:-.028em}
.dish .price{
  font-size:15px;font-weight:700;color:var(--ink);
  white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.dish .desc{margin:6px 0 0;font-size:14px;color:var(--ink-soft);line-height:1.5;max-width:52ch}
.dish .origin{margin-top:8px;font-size:12px;font-weight:500;color:var(--ink-faint)}
.dish .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:11px}
.dish .arrow{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-faint)}

.badge{
  font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;
  padding:4px 7px;border-radius:999px;background:var(--ok-wash);color:var(--ok);
}
.acode{
  font-family:var(--mono);font-size:10.5px;font-weight:500;padding:3px 6px;border-radius:999px;
  border:1px solid var(--rule);color:var(--ink-faint);font-variant-numeric:tabular-nums;
}
.acode.hit{background:var(--alert);border-color:var(--alert);color:#fff}

.dish.sold .name{text-decoration:line-through;text-decoration-thickness:1px;color:var(--ink-faint)}
.dish.sold .price{text-decoration:line-through;color:var(--ink-faint)}
.soldtag{
  font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;
  padding:4px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-soft);
}

.emptynote{display:none;padding:46px 0;text-align:center;color:var(--ink-faint);font-size:13.5px}
.emptynote.show{display:block}

/* ---------- Pie ---------- */
.legal{
  margin:54px 0 0;padding:22px 0 46px;border-top:2px solid var(--ink);
  font-size:12px;color:var(--ink-faint);line-height:1.6;max-width:60ch;
}
.legal p{margin:0 0 10px}
.legal .brand{
  margin-top:22px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-faint);
}

/* ---------- Pedido: barra fija ---------- */
body.has-cart{padding-bottom:74px}
.cartbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  max-width:var(--wrap);margin:0 auto;
  display:flex;align-items:center;gap:14px;
  padding:12px 22px calc(12px + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);
  transform:translateY(115%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  pointer-events:none;
}
.cartbar.show{transform:translateY(0);pointer-events:auto}
.cartbar .sum{display:flex;flex-direction:column;gap:1px;min-width:0}
.cartbar .n{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.62}
.cartbar .t{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cartbar .go{
  margin-left:auto;padding:12px 18px;border-radius:var(--r);
  background:var(--paper);color:var(--ink);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
}

/* ---------- Pedido: añadir ---------- */
.addrow{display:flex;gap:8px;align-items:center;margin:16px 0 4px}
.addbtn{
  flex:1;padding:13px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
}
.addbtn[disabled]{background:var(--surface-2);color:var(--ink-faint);cursor:default}
.wcard .add{
  margin-top:10px;display:inline-flex;align-items:center;gap:7px;
  padding:7px 11px;border:1px solid var(--accent);border-radius:var(--r);color:var(--accent);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
}

/* ---------- Pedido: líneas ---------- */
.oline{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--rule-soft)}
.oline .oname{flex:1;min-width:0;font-size:14.5px;font-weight:500;letter-spacing:-.02em}
.oline .osub{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:3px}
.oline .oprice{font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink-soft);white-space:nowrap}
.qty{display:flex;align-items:center;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;flex:0 0 auto}
.qty button{width:30px;height:30px;font-family:var(--mono);font-size:14px;color:var(--ink-soft);line-height:1}
.qty button:hover{background:var(--surface-2);color:var(--ink)}
.qty .v{width:26px;text-align:center;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.ototal{display:flex;justify-content:space-between;align-items:baseline;padding:15px 0 4px;border-top:2px solid var(--ink);margin-top:6px}
.ototal .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.ototal .val{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.tablefield{display:flex;align-items:center;gap:10px;margin:18px 0 4px}
.tablefield label{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.tablefield input{
  width:74px;padding:9px 11px;border:1px solid var(--rule);border-radius:var(--r);
  background:var(--surface);color:var(--ink);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;
}
.tablefield input:focus{outline:0;box-shadow:0 0 0 2px var(--accent)}

.upsell{margin:20px 0 0;padding:14px;border:1px solid var(--accent);border-radius:var(--r)}
.upsell .ul{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.upsell .urow{display:flex;align-items:center;gap:12px}
.upsell .un{flex:1;min-width:0;font-size:14px;font-weight:500;letter-spacing:-.02em}
.upsell .uw{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.45}
.upsell .up{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.upsell .ua{
  padding:7px 11px;border:1px solid var(--accent);border-radius:var(--r);color:var(--accent);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;flex:0 0 auto;
}

/* ---------- Pedido: confirmación y comanda de cocina ---------- */
.sentwrap{padding:6px 0 0}
.sentwrap .ok{
  display:flex;gap:11px;align-items:flex-start;padding:14px;border-radius:var(--r);
  background:var(--ok-wash);border-left:2px solid var(--ok);color:var(--ink);font-size:14px;line-height:1.5;
}
.sentwrap .ok .sym{font-family:var(--mono);color:var(--ok);font-weight:700}
.ticketlabel{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-faint);margin:24px 0 9px;
}
.ticket{
  font-family:var(--ticket);font-size:12px;line-height:1.7;
  border:1px dashed var(--rule);border-radius:var(--r);padding:16px;
  background:var(--surface);white-space:pre-wrap;overflow-x:auto;
  font-variant-numeric:tabular-nums;
}
.ticket .hl{color:var(--alert);font-weight:700}

/* ---------- Hoja inferior ---------- */
.scrim{
  position:fixed;inset:0;z-index:60;background:var(--scrim);
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.scrim.open{opacity:1;pointer-events:auto}

.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  max-width:var(--wrap);margin:0 auto;
  background:var(--surface);border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--lift);
  max-height:88vh;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .28s cubic-bezier(.32,.72,0,1);
}
.sheet.open{transform:translateY(0)}
.sheet .grab{width:34px;height:3px;border-radius:99px;background:var(--rule);margin:9px auto 0;flex:0 0 auto}
.sheet .head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 20px 13px;border-bottom:1px solid var(--rule);flex:0 0 auto;
}
.sheet .head h3{font-size:17px;font-weight:600;letter-spacing:-.025em;margin:0;line-height:1.25}
.sheet .close{
  width:30px;height:30px;flex:0 0 30px;border-radius:var(--r);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink-soft);
}
.sheet .body{padding:18px 20px 26px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .foot{
  padding:12px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);
  display:flex;gap:8px;flex:0 0 auto;background:var(--surface);
}
.sheet .foot button{
  flex:1;padding:13px;border-radius:var(--r);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;
}
.btn-primary{background:var(--ink);color:var(--paper)}
.btn-ghost{border:1px solid var(--rule);color:var(--ink-soft)}

.grouplabel{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:500;margin:2px 0 11px;
}
.chipwrap + .grouplabel, .modeswitch + .grouplabel{margin-top:26px}

.chipwrap{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  padding:9px 12px;border-radius:var(--r);border:1px solid var(--rule);
  font-size:13px;color:var(--ink-soft);transition:all .13s;
}
.chip[aria-pressed="true"]{background:var(--ok-wash);border-color:var(--ok);color:var(--ok);font-weight:500}

.alist{display:grid;grid-template-columns:1fr;gap:1px}
.arow{
  display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:var(--r);
  border:1px solid transparent;text-align:left;width:100%;transition:all .13s;
}
.arow:hover{background:var(--surface-2)}
.arow[aria-pressed="true"]{background:var(--alert-wash);border-color:var(--alert)}
.arow .num{
  width:25px;height:25px;flex:0 0 25px;border-radius:999px;border:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;font-weight:500;
  color:var(--ink-faint);font-variant-numeric:tabular-nums;
}
.arow[aria-pressed="true"] .num{background:var(--alert);border-color:var(--alert);color:#fff}
.arow .txt{font-size:14px}
.arow[aria-pressed="true"] .txt{font-weight:500;color:var(--alert)}
.arow .tick{margin-left:auto;font-size:12px;color:var(--alert);opacity:0}
.arow[aria-pressed="true"] .tick{opacity:1}

.modeswitch{display:flex;gap:0;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-bottom:4px}
.modeswitch button{
  flex:1;padding:10px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);transition:all .13s;
}
.modeswitch button + button{border-left:1px solid var(--rule)}
.modeswitch button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- Detalle de plato ---------- */
.dd-price{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums;margin:0 0 12px;letter-spacing:-.02em}
.dd-desc{font-size:14.5px;color:var(--ink-soft);line-height:1.55;margin:0 0 20px;max-width:52ch}
.dd-block{padding:14px;border:1px solid var(--rule);border-radius:var(--r);margin-bottom:10px}
.dd-block h4{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 11px;font-weight:500;
}
.dd-block ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.dd-block li{display:flex;align-items:center;gap:10px;font-size:14px}
.dd-block li .num{
  width:23px;height:23px;flex:0 0 23px;border-radius:999px;background:var(--alert);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10.5px;font-weight:500;
}
.dd-block.none{border-color:var(--ok)}
.dd-block.none p{margin:0;font-size:14px;color:var(--ok);font-weight:500}
.dd-warn{
  display:flex;gap:10px;padding:13px 14px;border-radius:var(--r);margin-bottom:10px;
  background:var(--alert-wash);border-left:2px solid var(--alert);
  font-size:13.5px;line-height:1.45;color:var(--ink);
}
.dd-warn .sym{font-family:var(--mono);color:var(--alert);font-weight:600}

/* ---------- Verzeichnis ---------- */
.matrixwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--rule);border-radius:var(--r)}
table.matrix{border-collapse:collapse;font-family:var(--mono);font-size:11px;width:100%;min-width:600px;font-variant-numeric:tabular-nums}
table.matrix th,table.matrix td{border-bottom:1px solid var(--rule-soft);padding:8px 7px;text-align:center}
table.matrix thead th{
  position:sticky;top:0;background:var(--surface);font-size:10px;font-weight:500;
  color:var(--ink-faint);letter-spacing:.04em;border-bottom:1px solid var(--ink);
}
table.matrix th.dishcol{
  text-align:left;position:sticky;left:0;background:var(--surface);z-index:2;
  min-width:200px;font-family:var(--grotesk);font-size:12.5px;font-weight:450;color:var(--ink);letter-spacing:-.015em;
}
table.matrix thead th.dishcol{z-index:3;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--ink-faint);letter-spacing:.16em;text-transform:uppercase}
table.matrix tr.catrow th.dishcol{
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:500;background:var(--surface-2);
}
table.matrix tr.catrow td{background:var(--surface-2)}
table.matrix td.yes{color:var(--alert);font-weight:700}
table.matrix td.no{color:var(--rule)}
.matrixnote{font-size:12px;color:var(--ink-faint);line-height:1.6;margin:14px 0 0;max-width:58ch}
.legendgrid{display:grid;gap:8px}
.legendgrid > div{display:flex;gap:10px;align-items:center;font-size:13px}
.legendgrid .num{
  width:23px;height:23px;flex:0 0 23px;border-radius:999px;border:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--ink-faint);font-variant-numeric:tabular-nums;
}

/* ============================================================
   Sistema visual (referencia: smart-menu.app)
   Mayúsculas con tracking abierto, pesos ligeros a tamaño grande,
   amarillo sólido en el estado activo, cápsulas y glow.
   Se aplica al final: mismos selectores, sin peleas de especificidad.
   ============================================================ */

/* --- Titulares: mayúsculas, tracking abierto, peso ligero --- */
.masthead h1{
  text-transform:uppercase;font-weight:700;letter-spacing:.045em;
  font-size:clamp(30px,8vw,44px);line-height:1.02;
}
.masthead h1 .lt{font-weight:300}
.masthead .eyebrow{font-weight:700;letter-spacing:.2em;font-size:11px}
.masthead .facts{font-weight:400;letter-spacing:.02em;color:var(--ink-faint)}
.masthead .hr{background:var(--rule)}

.section > h2{
  text-transform:uppercase;font-weight:700;letter-spacing:.09em;
  font-size:clamp(19px,5vw,24px);color:var(--ink);margin:0 0 15px;
}
.sheet .head h3{text-transform:uppercase;font-weight:700;letter-spacing:.06em;font-size:16px}

.tages .label,.waiter .whead .wlabel,.grouplabel,.ticketlabel,
.upsell .ul,.wread .rl,.cartbar .n,.ototal .lbl,.legal .brand,
.tablefield label,.dd-block h4{font-weight:700;letter-spacing:.18em;font-size:10.5px}

.cartbar .go,.sheet .foot button,.addbtn,.wform button,
.modeswitch button,.upsell .ua,.wsuggest button{
  font-weight:600;letter-spacing:.1em;text-transform:uppercase;
}

/* --- Cápsulas por todas partes --- */
.filterbtn,.iconbtn,.chip,.wsuggest button,.modeswitch,
.cartbar .go,.sheet .foot button,.addbtn,.wform button,.upsell .ua,
.langbar button,.navchips a,.qty{border-radius:999px}
.arow,.dd-block,.upsell,.ticket,.matrixwrap,.tablefield input,
.waiter,.wform input{border-radius:var(--r)}
.dish,.tages,.sheet{border-radius:var(--r-lg)}
.sheet{border-radius:var(--r-lg) var(--r-lg) 0 0}

/* --- Tarjeta de plato con miniatura --- */
.dish{
  display:flex;gap:14px;align-items:flex-start;
  background:var(--surface);border:1px solid var(--rule);padding:14px;
}
.dish:hover{border-color:rgba(230,220,201,.45);transform:none}
.dish .thumb{
  width:76px;height:76px;flex:0 0 76px;border-radius:14px;object-fit:cover;
  background:var(--surface-2);
}
.dish .col{flex:1;min-width:0;display:block}
.dish .top{display:flex}
.dish .desc,.dish .origin{display:block}
.dish .meta{display:flex}
.dish .name{font-weight:600;letter-spacing:-.01em;font-size:16px}
.dish .price{font-weight:700;letter-spacing:.01em;font-size:14.5px;color:var(--accent)}
.dish .desc{font-size:13px;color:var(--ink-soft);margin-top:4px}
.dish .origin{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--ink-faint);font-weight:500;margin-top:7px;
}
.dish .arrow{display:none}
.dish.sold{opacity:.45}

/* --- Menú del día: amarillo sólido, el estado "activo" de la referencia --- */
.tages{background:var(--accent);color:var(--accent-ink);box-shadow:var(--glow);padding:22px}
.tages .label{color:var(--accent-ink);opacity:.7}
.tages .date{color:var(--accent-ink);opacity:.7;font-weight:500}
.tages h2{
  text-transform:uppercase;font-weight:700;letter-spacing:.03em;
  font-size:21px;line-height:1.12;color:var(--accent-ink);
}
.tages p{color:var(--accent-ink);opacity:.78}
.tages .price{font-weight:700;color:var(--accent-ink);font-size:20px}
.tages .acode{border-color:rgba(10,10,10,.35);color:var(--accent-ink);opacity:1}
.tages .shot{
  width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;
  display:block;margin:14px 0 0;
}

/* --- Camarero digital: botón flotante siempre a la vista --- */
.waiterfab{
  position:fixed;right:16px;bottom:20px;z-index:49;
  display:flex;align-items:center;gap:9px;
  padding:13px 18px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);
  border:1px solid var(--accent);box-shadow:0 0 0 4px rgba(230,220,201,.14), 0 14px 34px rgba(0,0,0,.55);
  font-weight:700;font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;
  transition:bottom .24s cubic-bezier(.32,.72,0,1), transform .15s;
}
.waiterfab:hover{transform:translateY(-2px)}
.waiterfab:active{transform:translateY(0)}
body.has-cart .waiterfab{bottom:calc(90px + env(safe-area-inset-bottom))}
.waiterfab .fabdot{
  width:8px;height:8px;border-radius:999px;background:var(--accent-ink);
  animation:fabpulse 2.4s ease-in-out infinite;
}
@keyframes fabpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
@media (prefers-reduced-motion: reduce){.waiterfab .fabdot{animation:none}}
@media (max-width:400px){.waiterfab .fablabel{display:none}.waiterfab{padding:15px}}

/* --- Camarero digital: contenido de la hoja --- */
#sheetWaiter .whint{
  font-family:var(--script);font-size:20px;color:var(--accent);
  letter-spacing:0;margin:0 0 14px;line-height:1.2;
}
.wform{border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--surface-2)}
.wform input{background:transparent;border-radius:0;padding:15px 18px}
.wform input:focus{box-shadow:none}
.wform button{background:var(--accent);color:var(--accent-ink);border-radius:999px;margin:5px}
.wsuggest{padding:14px 0 0;background:transparent}
.wout{background:transparent;border-top:0;margin-top:6px}
.wread{padding:16px 0 0}
.wlist{padding:6px 0 0}
.wpair{padding:14px 0 0;border-top:1px solid var(--rule);margin-top:14px}
.wdisclaimer{padding:14px 0 0}
.wnone{padding:16px 0 0}
.wcard .name{font-weight:600;letter-spacing:-.01em}
.wcard .rank{color:var(--accent);font-weight:700}
.wcard .price{color:var(--accent);font-weight:700}
.wcard .why{border-left-color:var(--accent);color:var(--ink-soft)}
.wcard .shot{border-radius:14px}
.wpair b{color:var(--accent)}

/* --- Etiquetas --- */
.acode{font-weight:600;font-size:11px;padding:4px 9px;border-color:var(--rule)}
.badge,.soldtag{font-weight:600;font-size:10px;padding:5px 10px;letter-spacing:.1em}
.wread .rc{font-weight:600;font-size:11px;padding:5px 11px;letter-spacing:.06em}
.langbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.navchips a:hover{background:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"]{background:var(--ok-wash);border-color:var(--ok);color:var(--ok)}
.modeswitch button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* --- Acciones --- */
.btn-primary,.addbtn,.cartbar .go{background:var(--accent);color:var(--accent-ink)}
.cartbar{background:var(--surface);border-top:1px solid var(--rule);color:var(--ink)}
.cartbar .t{color:var(--accent);font-weight:700}
.filterbtn{background:var(--surface);border-color:var(--rule)}
.filterbtn.on{background:var(--accent-wash);border-color:var(--accent);color:var(--accent)}
.iconbtn{background:var(--surface);border-color:var(--rule)}
.sheet .close{background:var(--surface-2);color:var(--ink)}
.oline .oname{font-weight:600}
.ototal .val,.dd-price{color:var(--accent);font-weight:700}
.upsell{border-color:var(--accent)}
.upsell .un{font-weight:600}
.ticket{background:#000;border-color:var(--rule)}
.legal{border-top-color:var(--rule)}

/* --- Media: una sola regla para todas las fotos/vídeos --- */
.shot{
  display:block;width:100%;max-width:100%;height:auto;
  aspect-ratio:16/10;max-height:230px;object-fit:cover;
  border-radius:14px;margin:0 0 16px;background:var(--surface-2);
}
.tages .shot{margin:14px 0 0;max-height:200px}
.wcard .shot{margin:10px 0 0;max-height:170px}
/* Foto viva: zoom lentisimo para que ninguna ficha quede quieta */
.shotwrap{display:block;overflow:hidden;border-radius:6px;margin:0 0 16px}
.tages .shotwrap{margin:14px 0 0}
.wcard .shotwrap{margin:10px 0 0}
.shotwrap .shot{margin:0;border-radius:0;will-change:transform;animation:kenburns 16s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1) translate(0,0)}to{transform:scale(1.1) translate(-1.6%,1.2%)}}
@media (prefers-reduced-motion: reduce){.shotwrap .shot{animation:none}}
.sheet .body{overflow-x:hidden}

/* --- Modo pre-comanda: la tablet del camarero --- */
.tablet{
  border:1px solid var(--accent);border-radius:var(--r);padding:16px;
  background:var(--surface);box-shadow:var(--glow);
}
.tablet .thead{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding-bottom:11px;margin-bottom:11px;border-bottom:1px solid var(--rule);
}
.tablet .thead b{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.tablet .pend{
  font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent-ink);background:var(--accent);padding:4px 10px;border-radius:999px;
}
.tablet .trow{display:flex;gap:11px;align-items:baseline;padding:5px 0;font-size:14px}
.tablet .tq{color:var(--accent);font-weight:700;min-width:26px}
.tablet .tnote{
  margin-top:11px;padding:9px 12px;border-radius:999px;
  background:var(--alert-wash);color:var(--alert);
  font-size:11px;font-weight:700;letter-spacing:.08em;
}
.tablet .tconfirm{
  width:100%;margin-top:15px;padding:13px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);
  font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
}

/* --- Interruptor de demo --- */
.demoswitch{margin-top:26px;padding-top:18px;border-top:1px dashed var(--rule)}
.demoswitch .dl{
  display:block;margin-bottom:10px;font-size:10px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
}
.demoswitch .modeswitch button{font-size:10px;padding:10px 8px;letter-spacing:.06em}

/* ============================================================
   PRESENTACIÓN
   ============================================================ */
body.showing-intro .masthead,
body.showing-intro .sticky,
body.showing-intro main,
body.showing-intro .waiterfab,
body.showing-intro .cartbar{display:none !important}
body:not(.showing-intro) #intro{display:none}

#intro{background:var(--paper)}

.introbar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  display:flex;align-items:center;gap:12px;
  height:100px;padding:0 18px;
  background:linear-gradient(to bottom, rgba(41,41,41,.85), rgba(41,41,41,0));
  transition:background .25s, border-color .25s;
  border-bottom:1px solid transparent;
}
/* Pasado el hero necesita fondo propio: si no, los titulares
   pasan por debajo y se leen a través de la barra. */
.introbar.solid{
  background:rgba(41,41,41,.94);
  border-bottom-color:var(--rule);
}
@supports (backdrop-filter:blur(1px)){
  .introbar.solid{background:rgba(41,41,41,.78);backdrop-filter:saturate(150%) blur(14px);-webkit-backdrop-filter:saturate(150%) blur(14px)}
}
.introlang{flex:0 1 210px;gap:4px;padding:0;border:0}
.introlang button{padding:8px 0;font-size:10.5px;background:rgba(230,220,201,.12);color:var(--ink-soft)}
.introlang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.enterbtn{
  margin-left:auto;padding:12px 20px;border-radius:999px;
  background:var(--accent);color:var(--accent-ink);
  font-family:var(--sans);font-weight:600;font-size:11px;
  letter-spacing:.13em;text-transform:uppercase;white-space:nowrap;
  transition:transform .15s, opacity .15s;
}
.enterbtn:hover{transform:translateY(-2px)}
.enterbtn.big{margin:0;padding:16px 30px;font-size:12px}
/* El botón de la barra va perfilado, como los suyos arriba a la
   derecha; el relleno crema se reserva para la llamada del hero. */
#enterTop{
  background:rgba(230,220,201,.06);color:var(--ink);
  border:1px solid rgba(230,220,201,.35);
}
#enterTop:hover{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* --- Hero ---
   Composición de Sibuya: las dos líneas del claim NO van juntas.
   La primera arriba a la izquierda, la segunda abajo a la derecha,
   y el vídeo respirando en todo el hueco de en medio. --- */
.hero{position:relative;height:100svh;min-height:560px;overflow:hidden;background:#1E1E1E}
.herovid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.heroveil{
  position:absolute;inset:0;
  background:linear-gradient(to bottom, rgba(41,41,41,.60) 0%, rgba(41,41,41,.12) 42%, rgba(41,41,41,.94) 100%);
}
/* Monograma gigante de fondo, como su marca de palillos */
.heromono{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  font-family:var(--display);font-size:min(78vw,86vh);line-height:.78;
  color:var(--ink);opacity:.022;letter-spacing:.02em;
  pointer-events:none;user-select:none;white-space:nowrap;
}
/* Medidas tomadas del hero de Sibuya a 1280x551:
   antetítulo 14px arriba al 13,6% · línea 1 al 16,2% ·
   línea 2 al 55,5% · claim 100px peso 600 · ambas líneas crema. */
/* El hero ocupa todo el ancho, no la columna de lectura del menú.
   El margen lateral va en cada hijo: los elementos absolutos se
   posicionan contra la caja de padding y lo ignorarían. */
.hero{--heropad:clamp(22px,7vw,130px)}
.hero .inner{
  position:relative;z-index:2;height:100%;
  max-width:none;padding:0;
}
.hero .eyebrow{
  position:absolute;top:13.6%;left:var(--heropad);margin:0;
  font-family:var(--sans);font-weight:500;font-size:14px;
  letter-spacing:.06em;text-transform:uppercase;color:#707070;
}
.claim{
  position:absolute;inset:0;margin:0;
  font-family:var(--display);font-weight:400;text-transform:uppercase;
  font-size:clamp(46px,7.9vw,100px);line-height:1;letter-spacing:.012em;
  color:var(--ink);
  /* Bebas Neue libre sólo trae un peso; el suyo es 600.
     El trazo lo engorda sin cambiar las formas de las letras. */
  -webkit-text-stroke:1.1px currentColor;
}
.claim .l1,.claim .l2{
  position:absolute;display:block;white-space:nowrap;
  transition:transform .12s linear;
}
.claim .l1{top:16.2%;left:var(--heropad);text-align:left}

/* ============================================================
   VARIANTE «CRISTAL» — se activa con ?estilo=glass en la URL.
   No es la carta por defecto: la de siempre sigue igual, porque
   es la que va enlazada en los correos ya enviados.

   El cristal solo parece cristal si hay algo con textura detras.
   Sobre un fondo plano queda como un gris mas claro, asi que el
   fondo lleva tres manchas de color muy suaves de la propia paleta.
   ============================================================ */
.glass{
  --vidrio:rgba(255,255,255,.075);
  --vidrio-fuerte:rgba(255,255,255,.13);
  --vidrio-borde:rgba(255,255,255,.17);
  --vidrio-luz:rgba(255,255,255,.22);
  --desenfoque:blur(16px) saturate(150%);
}

.glass body{
  background:
    radial-gradient(50vw 50vw at 10% 4%,   rgba(204,187,155,.32), transparent 60%),
    radial-gradient(46vw 46vw at 92% 18%,  rgba(212,115,92,.26),  transparent 62%),
    radial-gradient(58vw 58vw at 46% 99%,  rgba(168,183,154,.20), transparent 58%),
    var(--paper);
  background-attachment:fixed;
}

/* Superficies grandes */
.glass .dish,
.glass .card,
.glass .sheet,
.glass .wsuggest,
.glass .wout,
.glass .ticket{
  background:var(--vidrio);
  -webkit-backdrop-filter:var(--desenfoque);
  backdrop-filter:var(--desenfoque);
  border:1px solid var(--vidrio-borde);
  box-shadow:inset 0 1px 0 var(--vidrio-luz), 0 12px 30px rgba(0,0,0,.26);
}
.glass .dish:hover{background:var(--vidrio-fuerte)}

/* Piezas pequenas: un punto mas opacas o se pierden */
.glass .chip,
.glass .acode,
.glass .qty,
.glass .sheet .close,
.glass .addbtn[disabled],
.glass .wq{
  background:var(--vidrio-fuerte);
  -webkit-backdrop-filter:blur(10px) saturate(140%);
  backdrop-filter:blur(10px) saturate(140%);
  border:1px solid var(--vidrio-borde);
}

/* Cabecera: ya era translucida, se le sube el cristal */
.glass .sticky{
  background:rgba(41,41,41,.55) !important;
  -webkit-backdrop-filter:blur(20px) saturate(170%) !important;
  backdrop-filter:blur(20px) saturate(170%) !important;
  border-bottom:1px solid var(--vidrio-borde);
}

/* La hoja inferior se apoya en el borde superior, no en la sombra */
.glass .sheet{
  border-bottom:0;
  box-shadow:inset 0 1px 0 var(--vidrio-luz), 0 -18px 50px rgba(0,0,0,.42);
}
.glass .sheet .foot{
  background:rgba(41,41,41,.5);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  backdrop-filter:blur(16px) saturate(150%);
  border-top:1px solid var(--vidrio-borde);
}

/* El boton de accion se queda solido: si el reclamo tambien es
   translucido, deja de ser el elemento mas visible de la pantalla. */
.glass .addbtn:not([disabled]),
.glass .sheet .foot button.primary{
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
}

/* Salidas de seguridad ------------------------------------------------
   1) Navegador sin backdrop-filter: fondos solidos de siempre.
   2) Sistema con transparencias reducidas (accesibilidad): idem.
   El desenfoque es caro en moviles viejos y esta carta se abre
   justamente en el movil del comensal. */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass .dish, .glass .card, .glass .sheet, .glass .wsuggest,
  .glass .wout, .glass .ticket{background:var(--surface)}
  .glass .chip, .glass .acode, .glass .qty,
  .glass .sheet .close, .glass .wq{background:var(--surface-2)}
  .glass .sticky{background:var(--paper) !important}
}
@media (prefers-reduced-transparency: reduce){
  .glass .dish, .glass .card, .glass .sheet, .glass .wsuggest,
  .glass .wout, .glass .ticket{
    background:var(--surface);
    -webkit-backdrop-filter:none;backdrop-filter:none;
  }
  .glass .sticky{background:var(--paper) !important;-webkit-backdrop-filter:none;backdrop-filter:none}
  .glass body{background:var(--paper)}
}
</style>

const state = {
  lang:DEFAULT_LANG,
  excluded:new Set(),   // números de alérgeno excluidos
  diets:new Set(),      // ids de dieta requeridos
  mode:"hide"           // "hide" | "mark"
};

const $  = function(s){ return document.querySelector(s); };
const $$ = function(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); };
const t  = function(){ return UI[state.lang]; };
const esc = function(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
};
const money = function(v){ return "CHF " + v.toFixed(2); };

/* Detecta el idioma del navegador — igual que en producción */
(function detectLang(){
  const supported = ["de","fr","it","en"];
  const list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || DEFAULT_LANG];
  for (let i=0;i<list.length;i++){
    const code = String(list[i]).slice(0,2).toLowerCase();
    if (supported.indexOf(code) !== -1){ state.lang = code; return; }
  }
})();

/* ============================================================
   4. LÓGICA DE FILTRADO
   ============================================================ */

function dishFails(d){
  // ¿contiene algún alérgeno excluido?
  for (const n of state.excluded){
    if (d.allergens.indexOf(n) !== -1) return true;
  }
  // ¿cumple todas las dietas exigidas?
  for (const id of state.diets){
    if (d.diet.indexOf(id) === -1) return true;
  }
  return false;
}

function filterCount(){ return state.excluded.size + state.diets.size; }

      : (m.img ? '<span class="shotwrap"><img class="shot" src="'+esc(m.img)+'" alt="'+esc(m.name[L])+'" decoding="async"></span>' : ""))+
    '<div class="foot">'+
      '<div class="codes">'+codes+'</div>'+
      '<div class="price">'+money(m.price)+'</div>'+
    '</div>';
}

function dishHTML(d){
  const L = state.lang;
  const fails = dishFails(d);
  let cls = "dish";
  if (fails && state.mode === "hide") cls += " hidden";
  if (fails && state.mode === "mark") cls += " dimmed";
  if (d.sold) cls += " sold";

  const badges = d.diet.filter(function(id){
    return id === "vegan" || id === "vegetarian" || id === "glutenfree";
  }).map(function(id){
    const dd = DIETS.find(function(x){ return x.id === id; });
    return '<span class="badge">'+esc(dd[L])+'</span>';
  }).join("");

  const codes = d.allergens.map(function(n){
    const hit = state.excluded.has(n) ? " hit" : "";
    return '<span class="acode'+hit+'">'+n+'</span>';
  }).join("");

  const origin = d.origin ? '<div class="origin">'+esc(d.origin[L])+'</div>' : "";
  const soldTag = d.sold ? '<span class="soldtag">'+esc(t().sold)+'</span>' : "";

  /* El video de la miniatura se engancha solo cuando la tarjeta entra en
     pantalla (data-lazy). El poster es un fotograma del propio video, asi que
     el relevo no se nota. Antes se descargaban los 17 videos de golpe al abrir
     la carta (~23 MB por visita) y eso agoto la cuota del alojamiento. */
  const thumb = d.video
    ? '<video class="thumb" data-lazy="'+esc(d.video)+'"'+(d.thumb ? ' poster="'+esc(d.thumb)+'"' : '')+' muted loop playsinline preload="none"></video>'
    : (d.thumb
      ? '<img class="thumb" src="'+esc(d.thumb)+'" alt="" loading="lazy" decoding="async">'
      : '<span class="thumb"></span>');

  return '<button type="button" class="'+cls+'" data-dish="'+d.id+'">'+
    thumb +
    '<span class="col">'+
      '<span class="top">'+
        '<span class="name">'+esc(d.name[L])+'</span>'+
        '<span class="price">'+money(d.price)+'</span>'+
      '</span>'+
      '<span class="desc">'+esc(d.desc[L])+'</span>'+
      origin+
      '<span class="meta">'+soldTag+badges+codes+'</span>'+
    '</span>'+
  '</button>';
}

function renderMenu(){
  const html = CATEGORIES.map(function(c){
    const list = DISHES.filter(function(d){ return d.cat === c.id; });

/* ============================================================
   5b. SMART WAITER
   El restaurante no configura nada: el perfil de cada plato
   (ligero/contundente, carne, pescado, regional) se DERIVA de
   la carta al crearla. En producción esa derivación la hace un
   LLM una sola vez y se guarda; aquí se calcula al cargar para
   que la demo funcione sin servidor ni clave de API.
   ============================================================ */

const norm = function(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
};
const has = function(txt, arr){
  for (let i=0;i<arr.length;i++){ if (txt.indexOf(arr[i]) !== -1) return true; }
  return false;
};

/* --- Derivación del perfil de cada plato --- */
function buildProfile(d){
  const txt = norm(d.name.de + " " + d.desc.de + " " + (d.origin ? d.origin.de : ""));
  const meatW  = ["kalb","schwein","rind","fleisch","schinken","speck","wurst","huhn","poulet","lamm","voressen","geschnetzeltes","cordon bleu"];
  const fishW  = ["forelle","egli","fisch","lachs"];
  const localW = ["bundner","luzern","vierwaldstatter","alpler","zurcher","emmental","sbrinz","gruyere","innerschweiz","schweiz","region","alpen",
                  "genfersee","waadt","lavaux","leman","walliser","freiburger","kanton","hof"];
  const lightW = ["salat","suppe","sorbet"];
  const heartyW= ["rosti","cordon","magronen","frites","nudeln"];

  const isFish = has(txt, fishW) || d.allergens.indexOf(4) !== -1;
  const isMeat = !isFish && has(txt, meatW);

  let weight = "medium";
  if (has(txt, lightW) || d.price < 14) weight = "light";
  else if (has(txt, heartyW) || d.price >= 30) weight = "hearty";

  // Tipo de bebida, para no ofrecer zumo cuando piden vino
  let drink = null;
  if (d.cat === "getraenke"){
    if (has(txt, ["riesling","silvaner","wein","weisswein","rotwein"])) drink = "wine";
    else if (has(txt, ["kaffee","espresso","cappuccino","crema"])) drink = "coffee";
    else drink = "soft";
  }

  return {
    isFish:isFish, isMeat:isMeat, isLocal:has(txt, localW), weight:weight,
    isDrink:d.cat === "getraenke", isSweet:d.cat === "dessert", drink:drink
  };
}
DISHES.forEach(function(d){ d.p = buildProfile(d); });

         "veloce","fretta","corsa","quick","in a hurry","hurry","fast","rapido","prisa","deprisa","apuro"]

const ALLERGEN_KW = {
  1:["gluten","weizen","wheat","trigo","getreide"],
  2:["krebstier","crustac","crostace","crustacean","marisco","gamba"],
  3:["eier","oeuf","uova","uovo","egg","huevo"],
  4:["fisch","poisson","pesce","fish","pescado"],
  5:["erdnuss","arachide","peanut","cacahuete"],
  6:["soja","soy"],
  7:["milch","laktose","lait","latte","lattosio","milk","leche","lactose"],
  8:["nusse","nuss","noix","noci","nut","fruto seco","frutos secos","schalenfrucht","mandel"],
  9:["sellerie","celeri","sedano","celery","apio"],
  10:["senf","moutarde","senape","mustard","mostaza"],
  11:["sesam","sesame","sesamo"],
  12:["sulfit","sulfite","solfiti","sulphite","sulfito","schwefel"],
  13:["lupin","lupine","altramuz"],
  14:["weichtier","mollusque","mollusc","mollusco","molusco"]
};

/* --- Interpretación de la pregunta --- */
function parseQuery(raw){
  const txt = norm(raw);
  const intent = {
    excludeMeat:false, excludeFish:false, vegetarian:false, vegan:false,
    light:false, filling:false, balanced:false,
    notHungry:false, veryHungry:false, quick:false,
    wantFish:false, wantSweet:false, wantDrink:false, local:false, cheap:false, surprise:false,
    wantWine:false, wantCoffee:false, wantSoft:false,
    glutenfree:false, lactosefree:false,
    allergens:[]
  };

  if (has(txt, KW.vegetarian)){ intent.vegetarian = true; intent.excludeMeat = true; intent.excludeFish = true; }
  if (has(txt, KW.noMeat))    { intent.excludeMeat = true; }
  if (has(txt, KW.vegan))     { intent.vegan = true; intent.excludeMeat = true; intent.excludeFish = true; }

  // Estado del comensal antes que sus deseos: "no tengo mucha hambre"
  // contiene literalmente "mucha hambre".
  intent.notHungry  = has(txt, KW.notHungry);
  intent.veryHungry = !intent.notHungry && has(txt, KW.veryHungry);
  intent.quick      = has(txt, KW.quick);

  intent.light   = has(txt, KW.light)   || intent.notHungry;
  intent.filling = has(txt, KW.filling) || intent.veryHungry;
  intent.balanced = intent.light && intent.filling && !intent.notHungry;

  intent.local    = has(txt, KW.local);
  intent.cheap    = has(txt, KW.cheap);
  intent.surprise = has(txt, KW.surprise);
  intent.wantSweet= has(txt, KW.sweet);
  // Tipo de bebida pedida. hasWord evita que "vin" case con "vinaigrette".
  const hasWord = function(s, words){
    for (let i=0;i<words.length;i++){
      if (new RegExp("(^|[^a-z])"+words[i]+"([^a-z]|$)").test(s)) return true;
    }
    return false;
  };
  if (hasWord(txt,["vin","vino"]) || has(txt,["wein","wine","riesling","silvaner"])) intent.wantWine = true;
  if (has(txt,["kaffee","cafe","caffe","coffee","espresso","cappuccino"])) intent.wantCoffee = true;
  if (has(txt,["saft","most","jus ","succo","juice","alkoholfrei","sans alcool","analcolico","non-alcoholic","sin alcohol","zumo"])) intent.wantSoft = true;
  intent.wantDrink= has(txt, KW.drink) || intent.wantWine || intent.wantCoffee || intent.wantSoft;
  intent.glutenfree  = has(txt, KW.glutenfree);
  intent.lactosefree = has(txt, KW.lactosefree);

  // Alérgenos: sólo cuentan si van detrás de una negación ("ohne …", "sin …")
  const windows = [];
  const re = /(ohne|keine|kein|sans|senza|without|sin|no)\s+([a-z\s\-]{1,30})/g;
  let m;
  while ((m = re.exec(txt)) !== null){ windows.push(m[2]); }
  Object.keys(ALLERGEN_KW).forEach(function(k){
    const n = Number(k);
    for (let i=0;i<windows.length;i++){
      if (has(windows[i], ALLERGEN_KW[n])){ if (intent.allergens.indexOf(n) === -1) intent.allergens.push(n); break; }
    }
  });
  if (intent.glutenfree  && intent.allergens.indexOf(1) === -1) intent.allergens.push(1);
  if (intent.lactosefree && intent.allergens.indexOf(7) === -1) intent.allergens.push(7);
  if (intent.allergens.indexOf(4) !== -1) intent.excludeFish = true;

  // Pescado como deseo, no como exclusión
  intent.wantFish = has(txt, KW.fish) && !intent.excludeFish;

  return intent;
}

/* --- Puntuación --- */
function scoreDish(d, intent){
  const p = d.p;
  if (d.sold) return null;
  if (p.isDrink && !intent.wantDrink) return null;
  if (intent.excludeMeat && p.isMeat) return null;
  if (intent.excludeFish && p.isFish) return null;
  if (intent.vegan && d.diet.indexOf("vegan") === -1) return null;
  if (intent.vegetarian && d.diet.indexOf("vegetarian") === -1) return null;
  if (intent.glutenfree && d.diet.indexOf("glutenfree") === -1) return null;
  if (intent.lactosefree && d.diet.indexOf("lactosefree") === -1) return null;
  for (let i=0;i<intent.allergens.length;i++){
    if (d.allergens.indexOf(intent.allergens[i]) !== -1) return null;
  }
  // El camarero respeta también los filtros que el comensal ya puso en la carta
  if (dishFails(d)) return null;

  let s = 0;
  if (intent.balanced)      s += (p.weight === "medium") ? 5 : 1;
  else if (intent.light)    s += (p.weight === "light") ? 4 : (p.weight === "medium" ? 1 : -3);
  else if (intent.filling)  s += (p.weight === "hearty") ? 4 : (p.weight === "medium" ? 1 : -3);

  if (intent.wantFish && !p.isFish) return null;   // si pide pescado, sólo pescado
  if (intent.wantSweet) s += p.isSweet ? 5 : -4;
  else if (p.isSweet)   s -= 1;
  if (intent.wantDrink) s += p.isDrink ? 5 : -5;
  // Si piden un tipo concreto de bebida, sólo ese tipo
  if (p.isDrink){
    if (intent.wantWine   && p.drink !== "wine")   return null;
    if (intent.wantCoffee && p.drink !== "coffee") return null;
    if (intent.wantSoft   && p.drink !== "soft")   return null;
  }
  if (intent.local)     s += p.isLocal ? 3 : -1;
  if (intent.cheap)     s += (35 - d.price) / 8;

  // Poca hambre: entrantes y postres suben, y el precio bajo ayuda
  if (intent.notHungry){
    if (d.cat === "vorspeisen") s += 3;
    else if (d.cat === "dessert") s += 1;
    else if (d.cat === "haupt") s -= 2;
    s += (30 - d.price) / 12;
  }
  // Con prisa: lo que sale antes de cocina
  if (intent.quick){
    if (d.cat === "vorspeisen") s += 2.5;
    if (d.price < 20) s += 1;
    if (p.weight === "hearty") s -= 1.5;
  }

  if (p.isLocal) s += 1;                       // el carácter de la casa cuenta
  if (d.cat === "haupt" && !intent.wantSweet && !intent.wantDrink && !intent.notHungry) s += 0.5;
  return s;
}

function recommend(intent){
  const scored = [];
  DISHES.forEach(function(d){
    const s = scoreDish(d, intent);
    if (s !== null && s > -2) scored.push({d:d, s:s});
  });
  scored.sort(function(a,b){ return b.s - a.s || a.d.price - b.d.price; });
  return scored.slice(0, 3).map(function(x){ return x.d; });
}

/* --- El "porqué" --- */
function reasonFor(d, intent, RL){
  const L = RL || state.lang;
  const f = W[L].frag, p = d.p, parts = [];

  if (intent.balanced && p.weight === "medium") parts.push(f.balanced);
  else if (intent.light && p.weight === "light") parts.push(f.light);
  else if (intent.filling && p.weight === "hearty") parts.push(f.filling);

  if (intent.vegan) parts.push(f.vegan);
  else if (intent.vegetarian) parts.push(f.vegetarian);
  else if (intent.excludeMeat) parts.push(f.noMeat);

  if (intent.wantFish && p.isFish) parts.push(p.isLocal ? f.fishLocal : f.fish);
  if (intent.glutenfree) parts.push(f.glutenfree);
  if (intent.lactosefree) parts.push(f.lactosefree);

  intent.allergens.forEach(function(n){
    if (n === 1 && intent.glutenfree) return;
    if (n === 7 && intent.lactosefree) return;
    const a = ALLERGENS.find(function(x){ return x.n === n; });
    if (a) parts.push(f.free(a[L]));
  });

  if (intent.cheap) parts.push(f.cheap);
  if (intent.local && p.isLocal) parts.push(f.local);

  // Un rasgo propio del plato, para que dos recomendaciones nunca
  // se justifiquen con exactamente la misma frase.
  let own = f.classic;
  if (p.isFish) own = p.isLocal ? f.fishLocal : f.fish;
  else if (d.diet.indexOf("vegan") !== -1) own = f.vegan;
  else if (p.isLocal) own = f.local;
  else if (p.weight === "light") own = f.light;
  else if (p.weight === "hearty") own = f.filling;

  const shown = parts.slice(0, 2);
  if (shown.indexOf(own) === -1) shown.push(own);

  const s = shown.join(", ");
  return s.charAt(0).toUpperCase() + s.slice(1) + ".";
}

/* --- La respuesta hablada: contesta a lo que han preguntado --- */
function speak(intent, picks, RL){
  const s = W[RL].say;
  const top = picks[0];
  // El nombre del plato va en el idioma de la carta; la frase, en el del comensal
  const slot = function(tpl){
    return tpl.replace("{d}", dishName(top, state.lang)).replace("{p}", money(top.price));
  };

  let lead;
  const constrained = intent.allergens.length || intent.glutenfree || intent.lactosefree ||
                      intent.vegan || intent.vegetarian || intent.excludeMeat;

  if (intent.notHungry)       lead = slot(s.notHungry);
  else if (intent.veryHungry) lead = slot(s.veryHungry);
  else if (intent.quick)      lead = slot(s.quick);
  else if (intent.wantDrink)  lead = slot(s.drink);
  else if (intent.wantSweet)  lead = slot(s.sweet);
  else if (intent.wantFish)   lead = slot(s.fish);
  else if (intent.balanced)   lead = slot(s.balanced);
  else if (intent.light)      lead = slot(s.light);
  else if (intent.filling)    lead = slot(s.filling);
  else if (constrained)       lead = slot(s.constrained) + " " + reasonFor(top, intent, RL);
  else                        lead = slot(s.generic) + " " + reasonFor(top, intent, RL);

  const rest = picks.length - 1;
  const more = rest > 0 ? " " + (rest === 1 ? s.more1 : s.moreN.replace("{n}", rest)) : "";
  return lead + more;
}

/* --- Maridaje: también derivado, sin configurar nada --- */
function pairFor(d){
  if (d.p.isDrink) return null;
  let id = "wein";
  if (d.p.isSweet) id = "kaffee";
  else if (d.diet.indexOf("vegan") !== -1) id = "suessmost";
  const pick = DISHES.find(function(x){ return x.id === id; });
  return (pick && !pick.sold) ? pick : null;
}

};

function detectQueryLang(raw){
  const txt = " " + norm(raw).replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ") + " ";
  const score = {};
  Object.keys(LANGCUES).forEach(function(l){
    score[l] = 0;
    LANGCUES[l].forEach(function(w){ if (txt.indexOf(" " + w + " ") !== -1) score[l]++; });
  });
  let best = null, bestN = 0;
  Object.keys(score).forEach(function(l){ if (score[l] > bestN){ bestN = score[l]; best = l; } });
  // Sin señal clara, se responde en el idioma de la carta
  return bestN >= 1 && best ? best : state.lang;
}

/* --- Render --- */
function renderWaiterChrome(){
  const w = W[state.lang];
  $("#wHint").textContent = w.hint;
  $("#wInput").placeholder = w.placeholder;
  $("#wSend").textContent = w.send;
  $("#wSuggest").innerHTML = w.suggestions.map(function(s){
    return '<button type="button" data-q="'+esc(s)+'">'+esc(s)+'</button>';
  }).join("");

function runWaiter(raw){
  const out = $("#wOut");
  const q = String(raw || "").trim();
  state.wq = q;
  if (!q){ out.classList.remove("show"); out.innerHTML = ""; return; }

  const RL = detectQueryLang(q);      // idioma en que responde
  const w = W[RL];
  const intent = parseQuery(q);
  const picks = recommend(intent);

  // Etiquetas de lo que ha entendido
  const chips = [];
  if (intent.vegan) chips.push(w.frag.vegan);
  else if (intent.vegetarian) chips.push(w.frag.vegetarian);
  else if (intent.excludeMeat) chips.push(w.frag.noMeat);
  if (intent.balanced) chips.push(w.frag.balanced);
  else if (intent.light) chips.push(w.frag.light);
  else if (intent.filling) chips.push(w.frag.filling);
  if (intent.wantFish) chips.push(w.frag.fish);
  if (intent.wantSweet) chips.push(w.frag.classic);
  if (intent.glutenfree) chips.push(w.frag.glutenfree);
  if (intent.lactosefree) chips.push(w.frag.lactosefree);
  if (intent.cheap) chips.push(w.frag.cheap);
  if (intent.local) chips.push(w.frag.local);
  intent.allergens.forEach(function(n){
    if ((n === 1 && intent.glutenfree) || (n === 7 && intent.lactosefree)) return;
    const a = ALLERGENS.find(function(x){ return x.n === n; });
    if (a) chips.push(w.frag.free(a[RL]));
  });

  const readHTML = chips.length
    ? '<div class="wread"><span class="rl">'+esc(w.understood)+'</span>'+
        chips.map(function(c){ return '<span class="rc">'+esc(c)+'</span>'; }).join("")+
      '</div>'
    : "";

  if (!picks.length){
    out.innerHTML = readHTML + '<p class="wnone">'+esc(w.none)+'</p>'+
      '<p class="wdisclaimer">'+esc(w.disclaimer)+'</p>';
    out.classList.add("show");
    return;
  }

  const L = state.lang;
  const cards = picks.map(function(d, i){
    const codes = d.allergens.map(function(n){ return '<span class="acode">'+n+'</span>'; }).join("");
    // El campo d.img es opcional: en cuanto el restaurante suba fotos, aparecen aquí.
    const shot = d.video
      ? '<video class="shot" src="'+esc(d.video)+'" autoplay muted loop playsinline preload="none"></video>'
      : (d.img ? '<span class="shotwrap"><img class="shot" src="'+esc(d.img)+'" alt="'+esc(d.name[L])+'"></span>' : "");
    return '<button type="button" class="wcard" data-dish="'+d.id+'">'+
      '<div class="top">'+
        '<span><span class="rank">'+(i+1)+'</span><span class="name">'+esc(d.name[L])+'</span></span>'+
        '<span class="price">'+money(d.price)+'</span>'+
      '</div>'+
      shot+
      '<p class="why">'+esc(reasonFor(d, intent, RL))+'</p>'+
      (codes ? '<div class="codes">'+codes+'</div>' : "")+
    '</button>';
  }).join("");

  const pair = pairFor(picks[0]);
  const pairHTML = pair
    ? '<p class="wpair">'+esc(w.pair)+' <b>'+esc(pair.name[L])+'</b> <span class="p">'+money(pair.price)+'</span></p>'
    : "";

  out.innerHTML =
    '<p class="wanswer">'+esc(speak(intent, picks, RL))+'</p>'+
    readHTML + '<div class="wlist">'+cards+'</div>' + pairHTML +
    '<p class="wdisclaimer">'+esc(w.disclaimer)+'</p>';
  out.classList.add("show");
}

state.cart = [];      // [{id, qty}]
state.table = "12";
state.sentAt = null;
state.orderMode = "kitchen";   // "kitchen" | "waiter"
state.confirmed = false;       // sólo en modo "waiter"

function cartLine(id){ return state.cart.find(function(x){ return x.id === id; }); }
function cartQty(id){ const l = cartLine(id); return l ? l.qty : 0; }
function cartCount(){ return state.cart.reduce(function(a,x){ return a + x.qty; }, 0); }
function cartTotal(){
  return state.cart.reduce(function(a,x){
    const d = DISHES.find(function(y){ return y.id === x.id; });
    return a + (d ? d.price * x.qty : 0);
  }, 0);
}
function cartAdd(id, n){
  const d = DISHES.find(function(x){ return x.id === id; });
  if (!d || d.sold) return;
  const l = cartLine(id);
  if (l) l.qty += (n || 1); else state.cart.push({id:id, qty:(n || 1)});
  state.sentAt = null;
  renderCart();
}
function cartSet(id, q){
  const i = state.cart.findIndex(function(x){ return x.id === id; });
  if (i === -1) return;
  if (q <= 0) state.cart.splice(i, 1); else state.cart[i].qty = q;
  renderCart();
  renderOrderSheet();
}

function renderCart(){
  const o = O[state.lang];
  const n = cartCount();
  $("#cartN").textContent = n + " " + o.positions;
  $("#cartT").textContent = money(cartTotal());
  $("#openOrder").textContent = o.order;
  $("#cartbar").classList.toggle("show", n > 0);
  document.body.classList.toggle("has-cart", n > 0);
}

/* Nota para la cocina con los alérgenos que el comensal excluyó */
function guestAllergenNote(){
  if (!state.excluded.size) return null;
  const names = [];
  state.excluded.forEach(function(n){
    const a = ALLERGENS.find(function(x){ return x.n === n; });
    if (a) names.push(a[KL()]);   // siempre en el idioma de la cocina
  });
  return names.join(", ");
}

function ticketHTML(){
  const time = state.sentAt || "--:--";
  const k = KITCHEN[KL()];
  const rule = "------------------------------";
  let s = k.table + " " + state.table + "        " + time + "\n" + rule + "\n";
  state.cart.forEach(function(x){
    const d = DISHES.find(function(y){ return y.id === x.id; });
    if (d) s += String(x.qty) + "x  " + d.name[KL()] + "\n";
  });
  s = esc(s);
  const note = guestAllergenNote();
  if (note) s += '<span class="hl">' + esc("!! " + k.guest + " " + note.toUpperCase()) + "</span>\n";
  s += esc(rule + "\n" + k.total.padEnd(15, " ") + money(cartTotal()));
  return s;
}

function renderOrderSheet(){
  const o = O[state.lang], L = state.lang;
  const body = $("#soBody"), foot = $("#soFoot");
  $("#soTitle").textContent = o.title;

  const m = M[state.lang];

  // Modo pre-comanda: el pedido espera en la tablet del camarero
  if (state.sentAt && state.orderMode === "waiter" && !state.confirmed){
    const note = guestAllergenNote();
    const k = KITCHEN[KL()];
    const rows = state.cart.map(function(x){
      const d = DISHES.find(function(y){ return y.id === x.id; });
      return d ? '<div class="trow"><span class="tq">'+x.qty+'×</span><span>'+esc(d.name[KL()])+'</span></div>' : "";
    }).join("");
    body.innerHTML =
      '<div class="sentwrap">'+
        '<div class="ok"><span class="sym">✓</span><span><b>'+esc(m.sentWaiterTitle)+'</b><br>'+
          esc(m.sentWaiterBody(state.table, cartCount(), state.sentAt))+'</span></div>'+
        '<div class="ticketlabel">'+esc(m.tablet)+'</div>'+
        '<div class="tablet">'+
          '<div class="thead"><b>'+esc(k.table+" "+state.table)+'</b>'+
            '<span class="pend">'+esc(m.pending)+' · '+esc(state.sentAt)+'</span></div>'+
          rows +
          (note ? '<div class="tnote">'+esc(k.guest+" "+note.toUpperCase())+'</div>' : "")+
          '<button type="button" class="tconfirm" id="confirmOrder">'+esc(m.confirm)+'</button>'+
        '</div>'+
        '<p class="matrixnote">'+esc(m.tabletNote)+'</p>'+
      '</div>';
    foot.innerHTML = '<button type="button" class="btn-ghost" id="newOrder">'+esc(o.newOrder)+'</button>';
    $("#confirmOrder").addEventListener("click", function(){
      state.confirmed = true;
      renderOrderSheet();
    });
    $("#newOrder").addEventListener("click", function(){
      state.cart = []; state.sentAt = null; state.confirmed = false;
      renderCart(); sheetClose();
    });
    return;
  }

  // Comanda en cocina (directa, o ya confirmada por el camarero)
  if (state.sentAt){
    body.innerHTML =
      '<div class="sentwrap">'+
        '<div class="ok"><span class="sym">✓</span><span><b>'+esc(o.sentTitle)+'</b><br>'+
          esc(o.sentBody(state.table, cartCount(), state.sentAt))+'</span></div>'+
        '<div class="ticketlabel">'+esc(o.kitchen)+'</div>'+
        '<div class="ticket">'+ticketHTML()+'</div>'+
        '<p class="matrixnote">'+esc(o.kitchenNote.replace("{kl}", LANGNAMES[state.lang][KL()]))+'</p>'+
      '</div>';
    foot.innerHTML = '<button type="button" class="btn-ghost" id="newOrder">'+esc(o.newOrder)+'</button>';
    $("#newOrder").addEventListener("click", function(){
      state.cart = []; state.sentAt = null; state.confirmed = false;
      renderCart(); sheetClose();
    });
    return;
  }

  if (!state.cart.length){
    body.innerHTML = '<p class="wnone">'+esc(o.empty)+'</p>';
    foot.innerHTML = "";
    return;
  }

  const lines = state.cart.map(function(x){
    const d = DISHES.find(function(y){ return y.id === x.id; });
    if (!d) return "";
    return '<div class="oline">'+
      '<div style="flex:1;min-width:0">'+
        '<div class="oname">'+esc(d.name[L])+'</div>'+
        '<div class="osub">'+money(d.price)+' · '+esc(d.allergens.join(", ") || "—")+'</div>'+
      '</div>'+
      '<div class="qty" data-id="'+d.id+'">'+
        '<button type="button" data-step="-1" aria-label="−">−</button>'+
        '<span class="v">'+x.qty+'</span>'+
        '<button type="button" data-step="1" aria-label="+">+</button>'+
      '</div>'+
      '<div class="oprice">'+money(d.price * x.qty)+'</div>'+
    '</div>';
  }).join("");

  // Maridaje: se calcula sobre lo que ya hay en la comanda
  const firstDish = DISHES.find(function(y){ return y.id === state.cart[0].id; });
  const pair = firstDish ? pairFor(firstDish) : null;
  const upsellHTML = (pair && !cartQty(pair.id))
    ? '<div class="upsell">'+
        '<div class="ul">'+esc(o.upsell)+'</div>'+
        '<div class="urow">'+
          '<div class="un">'+esc(pair.name[L])+
            '<div class="uw">'+esc(pair.desc[L])+'</div>'+
          '</div>'+
          '<div class="up">'+money(pair.price)+'</div>'+
          '<button type="button" class="ua" data-add="'+pair.id+'">+</button>'+
        '</div>'+
      '</div>'
    : "";

  body.innerHTML = lines +
    '<div class="ototal"><span class="lbl">'+esc(o.total)+'</span><span class="val">'+money(cartTotal())+'</span></div>'+
    '<div class="tablefield"><label for="tableNo">'+esc(o.table)+'</label>'+
      '<input type="text" inputmode="numeric" id="tableNo" value="'+esc(state.table)+'"></div>'+
    upsellHTML;

  foot.innerHTML = '<button type="button" class="btn-primary" id="sendOrder">'+
    esc(state.orderMode === "waiter" ? m.sendWaiter : o.send)+'</button>';

  // Cantidades
  $$('#soBody .qty').forEach(function(g){
    g.addEventListener("click", function(e){
      const b = e.target.closest("[data-step]");
      if (!b) return;
      const id = g.dataset.id;
      cartSet(id, cartQty(id) + Number(b.dataset.step));
    });
  });
  // Añadir el maridaje
  const ua = $("#soBody .ua");
  if (ua) ua.addEventListener("click", function(){ cartAdd(ua.dataset.add); renderOrderSheet(); });
  // Mesa
  $("#tableNo").addEventListener("input", function(e){
    state.table = e.target.value.replace(/[^0-9]/g, "").slice(0, 3) || "—";
  });
  // Enviar
  $("#sendOrder").addEventListener("click", function(){
    const now = new Date();
    state.sentAt = String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
    renderOrderSheet();
  });
}

let openSheet = null;

function sheetOpen(sel){
  const el = $(sel);
  // Si ya hay otra hoja abierta, se cierra: nunca dos a la vez
  if (openSheet && openSheet !== el){
    const prev = openSheet;
    prev.classList.remove("open");
    window.setTimeout(function(){ if (!prev.classList.contains("open")) prev.hidden = true; }, 300);
  }
  el.hidden = false;
  void el.offsetHeight;   // fuerza reflow para que arranque la transición
  el.classList.add("open");
  $("#scrim").classList.add("open");
  document.body.classList.add("is-locked");
  openSheet = el;
}

function sheetClose(){
  if (!openSheet) return;
  const el = openSheet;
  el.classList.remove("open");
  $("#scrim").classList.remove("open");
  document.body.classList.remove("is-locked");
  openSheet = null;
  window.setTimeout(function(){
    if (!el.classList.contains("open")) el.hidden = true;
  }, 300);
}

/* Parte el texto en caracteres para la entrada escalonada */
function splitChars(el, text, delay0){
  el.innerHTML = "";
  const words = String(text).split(" ");
  let i = 0;
  words.forEach(function(w, wi){
    const wrap = document.createElement("span");
    wrap.style.display = "inline-block";
    wrap.style.whiteSpace = "nowrap";
    w.split("").forEach(function(ch){
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = ch;
      s.style.animationDelay = ((delay0 || 0) + i * 0.028) + "s";
      wrap.appendChild(s);
      i++;
    });
    el.appendChild(wrap);
    if (wi < words.length - 1) el.appendChild(document.createTextNode(" "));
  });
  return i;
}

  return String(s)

    .replace(/\{since\}/g, RESTAURANT.since)
    .replace(/\{region\}/g, restRegion());
}

}

/* Revelado al hacer scroll.
   Comprobación por posición en vez de IntersectionObserver: si el
   usuario arrastra la barra o salta con un ancla, el observador no
   dispara los elementos que se ha saltado y se quedan invisibles.
   Esto revela todo lo que ya ha pasado por pantalla, siempre. */
let revealTick = false;
function checkReveals(){
  revealTick = false;
  const bar = $("#intro") ? document.querySelector(".introbar") : null;
  if (bar) bar.classList.toggle("solid", window.scrollY > 60);

  /* Deriva horizontal del claim: la primera línea se va hacia la
     izquierda y la segunda hacia la derecha al bajar. Es lo que hace
     que el texto sangre fuera de los bordes, como en Sibuya. */
  const l1 = document.querySelector(".claim .l1");
  const l2 = document.querySelector(".claim .l2");
  if (l1 && l2){
    const p = Math.min(1, window.scrollY / Math.max(1, window.innerHeight));
    const d = Math.round(p * 260);
    l1.style.transform = "translateX(" + (-d) + "px)";
    l2.style.transform = "translateX(" + d + "px)";
  }
  const limit = window.innerHeight * 0.9;
  $$("#intro .reveal:not(.in)").forEach(function(e){
    if (e.getBoundingClientRect().top < limit) e.classList.add("in");
  });
}
function observeReveals(){
  $$("#intro .reveal").forEach(function(e, i){
    e.style.transitionDelay = (i % 3) * 0.09 + "s";
  });
  checkReveals();
}
window.addEventListener("scroll", function(){
  if (revealTick) return;
  revealTick = true;
  window.requestAnimationFrame(checkReveals);
}, {passive:true});
window.addEventListener("resize", checkReveals, {passive:true});

function enterMenu(){
  document.body.classList.remove("showing-intro");
  window.scrollTo(0, 0);
  renderAll();
}

$$("[data-enter]").forEach(function(b){ b.addEventListener("click", enterMenu); });

/* Algunos móviles no arrancan el vídeo hasta que el usuario toca la
   pantalla, aunque esté silenciado. Se reintenta al primer gesto. */
/* Ningun video parado si esta a la vista: algunos moviles no
   arrancan el autoplay (ahorro de bateria, video creado por JS). */
window.setInterval(function(){
  document.querySelectorAll("video").forEach(function(v){
    var r = v.getBoundingClientRect();
    var cerca = r.bottom > -200 && r.top < window.innerHeight + 200;
    /* Enganchar el vídeo la primera vez que la tarjeta se asoma. */
    if (cerca && v.dataset.lazy && !v.getAttribute("src")){
      v.setAttribute("src", v.dataset.lazy);
      delete v.dataset.lazy;
    }
    if (!v.paused) return;
    if (!v.getAttribute("src")) return;
    if (cerca){
      v.muted = true;
      var p = v.play(); if (p && p.catch) p.catch(function(){});
    }
  });
}, 500);

(function heroPlayFallback(){
  const v = $("#heroVid");
  if (!v) return;
  const kick = function(){
    if (v.paused) { const p = v.play(); if (p && p.catch) p.catch(function(){}); }
  };
  ["touchstart","click","scroll"].forEach(function(ev){
    window.addEventListener(ev, kick, {once:true, passive:true});
  });
})();

$("#introLang").addEventListener("click", function(e){
  const b = e.target.closest("[data-lang]");
  if (!b) return;
  state.lang = b.dataset.lang;
  renderIntro();
  renderAll();
});

/* ============================================================
   8. ARRANQUE
   ============================================================ */

renderIntro();
renderAll();
</script>
